name: mt_llmkit_example
description: "Demonstrates how to use the llmcpp plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.5

  mt_llmkit:
    path: ../

  # Links llama.cpp's Apple XCFramework through SwiftPM. Without it llamadart falls
  # back to bundling its dylib as a native asset, which Flutter then wraps in a
  # framework whose Info.plist declares a wrong MinimumOSVersion (ITMS-90208).
  # Must be declared by the *app*: llamadart's build hook reads the app's pubspec.
  llamadart_llama_cpp_flutter: ^0.0.17

  cupertino_icons: ^1.0.8

  file_picker: ^8.1.2

  read_pdf_text: ^0.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true